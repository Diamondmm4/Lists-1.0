<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Lists 1.0</title>
<style>
  :root{
    --bg:#f7f7f5;
    --surface:#ffffff;
    --surface2:#f0f0ed;
    --text:#222222;
    --muted:#777777;
    --accent:#dfe7df;
    --accent-strong:#4f7056;
    --border:#deded9;
    --danger:#c94b4b;
    --shadow:0 10px 30px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  button,input{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;min-height:100vh}
  .screen.active{display:flex}
  .main-screen{position:relative;flex-direction:column;align-items:center;padding:42px 20px}
  .brand{font-size:clamp(30px,6vw,46px);font-weight:650;letter-spacing:-1.5px;margin-top:8vh;text-align:center}
  .main-actions{width:min(420px,90vw);display:flex;flex-direction:column;gap:18px;margin-top:48px}
  .main-btn,.theme-btn{
    border:1px solid var(--border);background:var(--accent);color:var(--text);
    border-radius:16px;transition:.16s ease;box-shadow:0 3px 10px rgba(0,0,0,.035)
  }
  .main-btn{min-height:68px;font-size:18px;font-weight:600}
  .main-btn:hover,.theme-btn:hover{transform:translateY(-1px);filter:brightness(.98)}
  .theme-btn{position:absolute;top:22px;right:22px;padding:10px 15px;font-size:14px;font-weight:600}
  .theme-menu{
    position:absolute;top:68px;right:18px;width:min(320px,calc(100vw - 36px));
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow);padding:12px;display:none;z-index:50
  }
  .theme-menu.open{display:block}
  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .theme-option{border:1px solid var(--border);border-radius:12px;padding:9px;background:var(--surface);text-align:left}
  .theme-option.selected{outline:2px solid var(--accent-strong);background:var(--surface2)}
  .swatches{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:7px}
  .swatch{flex:1}
  .theme-name{font-size:13px;font-weight:600}
  .topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
  .topbar-title{font-size:20px;font-weight:650;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:8px;min-width:100px}
  .topbar-right{justify-content:flex-end}
  .icon-btn,.text-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 12px;font-weight:600}
  .icon-btn{width:42px;height:42px;padding:0;font-size:20px}
  .danger{color:var(--danger)}
  .content{width:min(820px,94vw);margin:0 auto;padding:28px 0 70px}
  .list-name-wrap{display:flex;gap:10px;align-items:center;margin-bottom:22px}
  .list-name{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px 15px;font-size:19px;font-weight:600;outline:none}
  .list-name:focus{border-color:var(--accent-strong)}
  .list-area{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .section-title{padding:14px 18px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border)}
  .task-list{padding:5px 0}
  .task-row{display:grid;grid-template-columns:42px 1fr 38px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(128,128,128,.12);min-height:53px;background:var(--surface)}
  .task-row:last-child{border-bottom:0}
  .task-row.dragging{opacity:.45}
  .task-row.drag-over{border-top:2px solid var(--accent-strong)}
  .number{text-align:right;color:var(--muted);font-size:14px;user-select:none}
  .task-input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:7px 4px}
  .task-input::placeholder{color:#aaa}
  .check{width:26px;height:26px;border:1.5px solid #aaa;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:white}
  .check.checked{background:var(--accent-strong);border-color:var(--accent-strong)}
  .completed .task-row{opacity:.62}
  .completed .task-input{text-decoration:line-through}
  .completed .check{font-size:14px}
  .saved-screen,.editor-screen{flex-direction:column}
  .saved-content{width:min(820px,94vw);margin:0 auto;padding:28px 0 70px}
  .saved-empty{text-align:center;color:var(--muted);padding:70px 20px}
  .saved-list{display:flex;flex-direction:column;gap:10px}
  .saved-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px}
  .saved-card.selected{outline:2px solid var(--accent-strong);background:var(--surface2)}
  .saved-main{flex:1;min-width:0}
  .saved-title{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saved-meta{font-size:13px;color:var(--muted);margin-top:4px}
  .selection-check{width:25px;height:25px;border:1px solid #aaa;border-radius:7px;display:none;align-items:center;justify-content:center}
  .selection-mode .selection-check{display:flex}
  .selection-check.on{background:var(--accent-strong);color:white;border-color:var(--accent-strong)}
  .selection-trash{display:none}
  .selection-mode .selection-trash{display:block}
  .editor-body{flex:1;overflow:auto}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-backdrop.open{display:flex}
  .modal{width:min(420px,94vw);background:var(--surface);border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow);padding:22px}
  .modal h3{margin:0 0 9px;font-size:20px}
  .modal p{margin:0 0 20px;color:var(--muted);line-height:1.45}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px}
  .modal-actions button{border:1px solid var(--border);border-radius:11px;padding:10px 14px;background:var(--surface);font-weight:600}
  .modal-actions .primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
  .modal-actions .danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
  @media(max-width:560px){
    .topbar{padding:0 10px}.topbar-left,.topbar-right{min-width:80px}
    .topbar-title{font-size:18px}.content,.saved-content{width:94vw}
    .main-btn{min-height:62px}.main-actions{margin-top:38px}
  }
</style>
</head>
<body>
<div class="app">

  <section id="mainScreen" class="screen main-screen active">
    <button id="themeBtn" class="theme-btn">Theme</button>
    <div id="themeMenu" class="theme-menu">
      <div class="theme-grid" id="themeGrid"></div>
    </div>
    <h1 class="brand">Lists 1.0</h1>
    <div class="main-actions">
      <button class="main-btn" id="newListBtn">Create New List</button>
      <button class="main-btn" id="savedListsBtn">Saved Lists</button>
    </div>
  </section>

  <section id="savedScreen" class="screen saved-screen">
    <header class="topbar">
      <div class="topbar-left"><button class="icon-btn" id="savedBackBtn" aria-label="Back">‹</button></div>
      <div class="topbar-title">Saved Lists</div>
      <div class="topbar-right">
        <button class="text-btn" id="selectBtn">Select</button>
        <button class="icon-btn danger selection-trash" id="savedTrashBtn" aria-label="Delete selected">⌫</button>
      </div>
    </header>
    <main class="saved-content">
      <div id="savedListContainer" class="saved-list"></div>
    </main>
  </section>

  <section id="editorScreen" class="screen editor-screen">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="editorLeftBtn" aria-label="Back">‹</button>
      </div>
      <div class="topbar-title" id="editorTitle">New List</div>
      <div class="topbar-right">
        <button class="text-btn" id="editorDoneBtn">Done</button>
      </div>
    </header>
    <main class="editor-body">
      <div class="content">
        <div class="list-name-wrap">
          <input id="listNameInput" class="list-name" placeholder="List name" autocomplete="off">
        </div>
        <div class="list-area">
          <div class="section-title">Tasks</div>
          <div id="activeTasks" class="task-list"></div>
          <div id="completedSection" class="completed" style="display:none">
            <div class="section-title">Completed</div>
            <div id="completedTasks" class="task-list"></div>
          </div>
        </div>
      </div>
    </main>
  </section>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = "lists-1.0-data";
  const THEME_KEY = "lists-1.0-theme";

  const themes = {
    light:  {name:"Light",  bg:"#f7f7f5", surface:"#ffffff", surface2:"#f0f0ed", text:"#222222", muted:"#777777", accent:"#e8e8e4", strong:"#555555", border:"#deded9"},
    dark:   {name:"Dark",   bg:"#151515", surface:"#202020", surface2:"#292929", text:"#f2f2f2", muted:"#a4a4a4", accent:"#303030", strong:"#aaaaaa", border:"#3b3b3b"},
    green:  {name:"Green",  bg:"#f3f7f2", surface:"#ffffff", surface2:"#e7efe5", text:"#203022", muted:"#6d7b6f", accent:"#dce9d9", strong:"#4f7056", border:"#d2ddd0"},
    blue:   {name:"Blue",   bg:"#f2f6fa", surface:"#ffffff", surface2:"#e4edf6", text:"#1d2b38", muted:"#687787", accent:"#dbe7f2", strong:"#496b89", border:"#cfdae4"},
    purple: {name:"Purple", bg:"#f6f3f9", surface:"#ffffff", surface2:"#ebe4f2", text:"#30233a", muted:"#796e80", accent:"#e4d9eb", strong:"#70527d", border:"#ddd1e2"},
    orange: {name:"Orange", bg:"#fbf5ef", surface:"#ffffff", surface2:"#f3e5d7", text:"#38291d", muted:"#806f60", accent:"#f0dfce", strong:"#a36b3d", border:"#e3d5c8"},
    red:    {name:"Red",    bg:"#fbf3f3", surface:"#ffffff", surface2:"#f2dddd", text:"#382121", muted:"#806969", accent:"#efdada", strong:"#9b5252", border:"#e2cccc"},
    teal:   {name:"Teal",   bg:"#f1f8f7", surface:"#ffffff", surface2:"#dceceb", text:"#193231", muted:"#687b7a", accent:"#d5e7e5", strong:"#46736f", border:"#cbdedc"}
  };

  const state = {
    lists: loadLists(),
    theme: localStorage.getItem(THEME_KEY) || "light",
    editingId: null,
    editingFromSaved: false,
    dirty: false,
    selectionMode: false,
    selectedIds: new Set(),
    modalResolver: null
  };

  const $ = id => document.getElementById(id);
  const screens = ["mainScreen","savedScreen","editorScreen"];

  function loadLists(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveLists(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.lists)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function applyTheme(name){
    const t = themes[name] || themes.light;
    const root = document.documentElement;
    root.style.setProperty("--bg",t.bg);
    root.style.setProperty("--surface",t.surface);
    root.style.setProperty("--surface2",t.surface2);
    root.style.setProperty("--text",t.text);
    root.style.setProperty("--muted",t.muted);
    root.style.setProperty("--accent",t.accent);
    root.style.setProperty("--accent-strong",t.strong);
    root.style.setProperty("--border",t.border);
    state.theme=name;
    localStorage.setItem(THEME_KEY,name);
    renderThemes();
  }

  function renderThemes(){
    const grid = $("themeGrid");
    grid.innerHTML = Object.entries(themes).map(([key,t]) => `
      <button class="theme-option ${state.theme===key?"selected":""}" data-theme="${key}">
        <div class="swatches"><span class="swatch" style="background:${t.bg}"></span><span class="swatch" style="background:${t.strong}"></span></div>
        <div class="theme-name">${t.name}</div>
      </button>`).join("");
    grid.querySelectorAll(".theme-option").forEach(b => b.onclick = () => {
      applyTheme(b.dataset.theme);
      $("themeMenu").classList.remove("open");
    });
  }

  function showScreen(id){
    screens.forEach(s => $(s).classList.toggle("active",s===id));
    $("themeMenu").classList.remove("open");
  }

  function openModal(title,message,buttons){
    return new Promise(resolve => {
      state.modalResolver=resolve;
      $("modalTitle").textContent=title;
      $("modalMessage").textContent=message;
      $("modalActions").innerHTML="";
      buttons.forEach(b => {
        const btn=document.createElement("button");
        btn.textContent=b.label;
        if(b.className) btn.className=b.className;
        btn.onclick=()=>{ $("modalBackdrop").classList.remove("open"); const r=state.modalResolver; state.modalResolver=null; r(b.value); };
        $("modalActions").appendChild(btn);
      });
      $("modalBackdrop").classList.add("open");
    });
  }

  function createList(name=""){
    const list = {id:uid(),name:name.trim() || "Untitled List",tasks:[{id:uid(),text:"",done:false}],updatedAt:Date.now()};
    return list;
  }

  function openNewList(){
    state.editingId=null;
    state.editingFromSaved=false;
    state.dirty=false;
    $("editorTitle").textContent="New List";
    $("editorLeftBtn").textContent="⌫";
    $("editorLeftBtn").classList.add("danger");
    $("editorLeftBtn").dataset.action="delete";
    $("editorDoneBtn").textContent="Done";
    $("listNameInput").value="";
    renderEditor([{id:uid(),text:"",done:false}]);
    showScreen("editorScreen");
    setTimeout(()=>document.querySelector(".task-input")?.focus(),60);
  }

  function openSavedList(id){
    const list=state.lists.find(x=>x.id===id);
    if(!list) return;
    state.editingId=id;
    state.editingFromSaved=true;
    state.dirty=false;
    $("editorTitle").textContent="Edit List";
    $("editorLeftBtn").textContent="‹";
    $("editorLeftBtn").classList.remove("danger");
    $("editorLeftBtn").dataset.action="back";
    $("listNameInput").value=list.name;
    renderEditor(list.tasks);
    showScreen("editorScreen");
  }

  function currentTasks(){
    return [...document.querySelectorAll("#activeTasks .task-row, #completedTasks .task-row")].map(row => ({
      id:row.dataset.id,
      text:row.querySelector(".task-input").value,
      done:row.closest("#completedTasks") !== null
    }));
  }

  function normalizeTasks(tasks){
    const active=tasks.filter(t=>!t.done);
    const completed=tasks.filter(t=>t.done);
    if(active.length===0) active.push({id:uid(),text:"",done:false});
    return [...active,...completed];
  }

  function renderEditor(tasks){
    tasks=normalizeTasks(tasks);
    const active=tasks.filter(t=>!t.done), completed=tasks.filter(t=>t.done);
    $("activeTasks").innerHTML="";
    $("completedTasks").innerHTML="";
    active.forEach((t,i)=>addTaskRow(t,false,i));
    completed.forEach((t,i)=>addTaskRow(t,true,i));
    $("completedSection").style.display=completed.length ? "block" : "none";
  }

  function addTaskRow(task,done,index){
    const row=document.createElement("div");
    row.className="task-row";
    row.draggable=!done;
    row.dataset.id=task.id;
    row.innerHTML=`
      <div class="number">${done ? "" : (index+1)+"."}</div>
      <input class="task-input" value="${esc(task.text)}" placeholder="${done?"":"Task"}" autocomplete="off">
      <button class="check ${done?"checked":""}" aria-label="Complete task">${done?"✓":""}</button>`;
    const input=row.querySelector(".task-input");
    input.addEventListener("input",()=>{state.dirty=true;});
    input.addEventListener("keydown",handleTaskKey);
    row.querySelector(".check").onclick=()=>toggleDone(row);
    if(!done){
      row.addEventListener("dragstart",e=>{row.classList.add("dragging");e.dataTransfer.setData("text/plain",task.id);});
      row.addEventListener("dragend",()=>row.classList.remove("dragging"));
      row.addEventListener("dragover",e=>{e.preventDefault();row.classList.add("drag-over");});
      row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
      row.addEventListener("drop",e=>{e.preventDefault();row.classList.remove("drag-over");reorderTask(e.dataTransfer.getData("text/plain"),row.dataset.id);});
    }
    (done ? $("completedTasks") : $("activeTasks")).appendChild(row);
  }

  function updateNumbers(){
    document.querySelectorAll("#activeTasks .task-row").forEach((row,i)=>row.querySelector(".number").textContent=(i+1)+".");
  }

  function reorderTask(fromId,toId){
    if(fromId===toId) return;
    const rows=[...document.querySelectorAll("#activeTasks .task-row")];
    const from=rows.find(r=>r.dataset.id===fromId), to=rows.find(r=>r.dataset.id===toId);
    if(!from||!to) return;
    const all=[...rows];
    const fromIndex=all.indexOf(from), toIndex=all.indexOf(to);
    if(fromIndex<toIndex) to.after(from); else to.before(from);
    updateNumbers(); state.dirty=true;
  }

  function toggleDone(row){
    const id=row.dataset.id;
    const all=currentTasks();
    const task=all.find(t=>t.id===id);
    if(!task) return;
    task.done=!task.done;
    state.dirty=true;
    renderEditor(all);
  }

  function handleTaskKey(e){
    if(e.key==="Enter"){
      e.preventDefault();
      const rows=[...document.querySelectorAll("#activeTasks .task-row")];
      const row=e.target.closest(".task-row");
      const idx=rows.indexOf(row);
      if(e.target.value.trim()===""){
        const next=rows[idx+1]?.querySelector(".task-input");
        (next || e.target).focus();
        return;
      }
      const newTask={id:uid(),text:"",done:false};
      addTaskRow(newTask,false,idx+1);
      const newRow=$("activeTasks").querySelector(`[data-id="${newTask.id}"]`);
      if(idx+1 < rows.length) rows[idx+1].before(newRow);
      updateNumbers(); state.dirty=true;
      newRow.querySelector(".task-input").focus();
    }
    if((e.key==="Backspace" || e.key==="Delete") && e.target.value===""){
      const rows=[...document.querySelectorAll("#activeTasks .task-row")];
      const row=e.target.closest(".task-row"), idx=rows.indexOf(row);
      if(rows.length>1){
        const previous=rows[idx-1]?.querySelector(".task-input");
        row.remove(); updateNumbers(); state.dirty=true;
        if(previous) { previous.focus(); previous.setSelectionRange(previous.value.length,previous.value.length); }
      }
    }
  }

  function collectEditorList(){
    let tasks=currentTasks();
    tasks=normalizeTasks(tasks);
    return {
      id:state.editingId || uid(),
      name:$("listNameInput").value.trim() || "Untitled List",
      tasks,
      updatedAt:Date.now()
    };
  }

  function autosaveEditor(){
    const list=collectEditorList();
    if(state.editingId){
      const idx=state.lists.findIndex(x=>x.id===state.editingId);
      if(idx>=0) state.lists[idx]=list;
    } else {
      state.editingId=list.id;
      state.editingFromSaved=true;
      state.lists.unshift(list);
      $("editorLeftBtn").textContent="‹";
      $("editorLeftBtn").classList.remove("danger");
      $("editorLeftBtn").dataset.action="back";
      $("editorTitle").textContent="Edit List";
    }
    saveLists(); state.dirty=false;
  }

  function renderSaved(){
    const box=$("savedListContainer");
    if(!state.lists.length){
      box.innerHTML='<div class="saved-empty">No saved lists yet.<br>Create your first list to see it here.</div>';
      return;
    }
    box.innerHTML=state.lists.map(list=>{
      const completed=list.tasks.filter(t=>t.done).length;
      const total=list.tasks.length;
      return `<div class="saved-card ${state.selectedIds.has(list.id)?"selected":""}" data-id="${list.id}">
        <div class="selection-check ${state.selectedIds.has(list.id)?"on":""}">${state.selectedIds.has(list.id)?"✓":""}</div>
        <div class="saved-main">
          <div class="saved-title">${esc(list.name)}</div>
          <div class="saved-meta">${total} task${total===1?"":"s"} · ${completed} completed</div>
        </div>
        <button class="icon-btn open-saved" aria-label="Open list">›</button>
      </div>`;
    }).join("");
    box.querySelectorAll(".saved-card").forEach(card=>{
      card.onclick=e=>{
        if(state.selectionMode){
          if(e.target.closest(".open-saved")) return;
          const id=card.dataset.id;
          state.selectedIds.has(id) ? state.selectedIds.delete(id) : state.selectedIds.add(id);
          renderSaved();
        } else openSavedList(card.dataset.id);
      };
    });
  }

  async function doneEditing(){
    if(!state.dirty){
      showScreen(state.editingFromSaved ? "savedScreen" : "mainScreen");
      if(state.editingFromSaved) renderSaved();
      return;
    }
    const answer=await openModal("Unsaved changes","Would you like to save this list or discard your changes?",[
      {label:"Discard",value:"discard"},
      {label:"Save",value:"save",className:"primary"}
    ]);
    if(answer==="save"){
      autosaveEditor();
      showScreen("savedScreen"); renderSaved();
    } else {
      showScreen(state.editingFromSaved ? "savedScreen" : "mainScreen");
      if(state.editingFromSaved) renderSaved();
    }
  }

  async function deleteCurrent(){
    const answer=await openModal("Delete list?","This will permanently delete the entire list.",[
      {label:"Cancel",value:"cancel"},
      {label:"Delete",value:"delete",className:"danger-fill"}
    ]);
    if(answer==="delete"){
      if(state.editingId) state.lists=state.lists.filter(x=>x.id!==state.editingId);
      saveLists(); state.dirty=false;
      if(state.editingFromSaved){ showScreen("savedScreen"); renderSaved(); }
      else showScreen("mainScreen");
    }
  }

  async function deleteSelected(){
    if(!state.selectedIds.size) return;
    const answer=await openModal("Delete selected lists?","The selected lists will be permanently deleted.",[
      {label:"Cancel",value:"cancel"},
      {label:"Delete",value:"delete",className:"danger-fill"}
    ]);
    if(answer==="delete"){
      state.lists=state.lists.filter(x=>!state.selectedIds.has(x.id));
      state.selectedIds.clear();
      saveLists(); renderSaved();
    }
  }

  $("themeBtn").onclick=e=>{e.stopPropagation();$("themeMenu").classList.toggle("open");};
  document.addEventListener("click",e=>{if(!e.target.closest("#themeMenu")&&!e.target.closest("#themeBtn"))$("themeMenu").classList.remove("open");});
  $("newListBtn").onclick=openNewList;
  $("savedListsBtn").onclick=()=>{state.selectionMode=false;state.selectedIds.clear();$("savedScreen").classList.remove("selection-mode");$("selectBtn").textContent="Select";renderSaved();showScreen("savedScreen");};
  $("savedBackBtn").onclick=()=>{state.selectionMode=false;state.selectedIds.clear();showScreen("mainScreen");};
  $("selectBtn").onclick=()=>{
    state.selectionMode=!state.selectionMode;
    if(!state.selectionMode) state.selectedIds.clear();
    $("savedScreen").classList.toggle("selection-mode",state.selectionMode);
    $("selectBtn").textContent=state.selectionMode?"Select":"Select";
    renderSaved();
  };
  $("savedTrashBtn").onclick=deleteSelected;
  $("editorDoneBtn").onclick=doneEditing;
  $("editorLeftBtn").onclick=()=>{
    if($("editorLeftBtn").dataset.action==="delete") deleteCurrent();
    else {showScreen("savedScreen");renderSaved();}
  };
  $("listNameInput").addEventListener("input",()=>state.dirty=true);

  // Autosave after edits, without producing duplicate versions.
  setInterval(()=>{ if($("editorScreen").classList.contains("active") && state.dirty) autosaveEditor(); },1200);

  applyTheme(state.theme);
  renderThemes();
})();
</script>
</body>
</html>
